name: Publish Colors to npm

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "dist/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "LICENSE"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-colors
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Check whether this version is already published
        id: package-version
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view "$package_name" version 2>/dev/null || true)"

          if [ "$package_version" = "$published_version" ]; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version is already published; skipping."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.package-version.outputs.already-published != 'true'
        run: npm publish --access public
